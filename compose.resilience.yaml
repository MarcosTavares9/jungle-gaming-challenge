# Disposable override of the same services used for local execution.
services:
  postgres:
    environment:
      POSTGRES_DB: ${TEST_DATABASE_NAME:?}
    ports: !override ["127.0.0.1::5432"]
  localstack:
    ports: !override ["127.0.0.1::4566"]
  setup:
    environment:
      DATABASE_URL: postgresql://jungle:jungle@postgres:5432/${TEST_DATABASE_NAME:?}
      SQS_QUEUE_PREFIX: ${TEST_QUEUE_PREFIX:?}
  app:
    environment:
      DATABASE_URL: postgresql://jungle:jungle@postgres:5432/${TEST_DATABASE_NAME:?}
      SQS_QUEUE_PREFIX: ${TEST_QUEUE_PREFIX:?}
    ports: !override ["127.0.0.1::3000"]
